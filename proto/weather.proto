syntax = "proto3";

package weather;

service WeatherService {
  rpc GetAllWeather (CityRequest) returns (WeatherList);
  rpc GetWeatherById (WeatherIdRequest) returns (Weather);
  rpc CreateWeather (CreateWeatherRequest) returns (Weather);
  rpc UpdateWeather (UpdateWeatherRequest) returns (Weather);
  rpc DeleteWeather (WeatherIdRequest) returns (DeleteResponse);
}

message CityRequest {
  string city = 1;
}

message WeatherIdRequest {
  string id = 1;
}

message Weather {
  string id = 1;
  string city = 2;
  float temperature = 3;
  float wind_speed = 4;
  float rainfall = 5;
  string condition = 6;    // CLEAR, CLOUDY, RAIN, STORM, FOG, SNOW
  bool is_dangerous = 7;
  string updated_at = 8;
}

message WeatherList {
  repeated Weather weather = 1;
}

message CreateWeatherRequest {
  string city = 1;
  float temperature = 2;
  float wind_speed = 3;
  float rainfall = 4;
  string condition = 5;
}

message UpdateWeatherRequest {
  string id = 1;
  float temperature = 2;
  float wind_speed = 3;
  float rainfall = 4;
  string condition = 5;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}
